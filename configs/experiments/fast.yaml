# Fast overlay (`--overlay fast`) for a quick first real-data pass on a 4-CPU machine without GPU.
# Used by the EEGNet stream only (logistic regression runs at the full specification without it). EEGNet: folds
# 0-2 of the frozen 5, 1 seed, <= 12 epochs per person, <= 10 passes, 10 FL rounds, LiRA 4 shadows (federated, eps 8/inf). Runs are tagged overlay=fast. Re-run without the overlay
# (or with `budget`) for the full specification.
overrides:
  models:
    eegnet: {seeds: [0], max_epochs: 10, patience: 3, max_epochs_per_person: 12}
    train: {folds: [0, 1, 2]}
  fl: {rounds: 10, engine: inprocess}
  audit:
    n_shadows_logreg: 32
    n_shadows_eegnet: 4
    eegnet_target_epsilons: [8, inf]
