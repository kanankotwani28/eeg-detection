description: Privacy cost - FedAvg + participant-level DP, epsilon in {1,3,8,inf} at delta=1e-5
task: T1
regime: federated
run_models: [logreg, eegnet]
fl: {strategy: fedavg, partition: iid}
dp: {enabled: true, target_epsilons: [1, 3, 8, inf]}
feature_transform: participant_relative   # no cross-subject statistics: required for DP LR, used at every eps incl. inf
